<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momento musicale — La città triste</title>
  <meta name="description" content="Momento musicale: la colonna sonora di «La città triste» di Roberto Fader. Canzoni in italiano.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="rain" aria-hidden="true"></div>

  <header class="hero">
    <div class="wrap hero-inner">
      <img class="cover" src="assets/img/cover.jpg" alt="Copertina di La città triste">
      <div>
        <p class="eyebrow">Ministero dei Sentimenti · Avviso n. 1</p>
        <h1>Momento<br><em>musicale</em></h1>
        <p class="lead">La colonna sonora di <strong>La città triste</strong>, romanzo di Roberto Fader.</p>
        <p class="decree">Nella città di Sinea i sorrisi sono vietati.<br>Queste canzoni no.</p>
        <button class="btn" id="playAll" type="button">▶ Ascolta dall'inizio</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">Tracce</h2>
    <ol class="tracks" id="tracks"></ol>

    <section class="lyrics" id="lyrics" hidden>
      <p class="eyebrow" id="lyricsScene"></p>
      <h2 id="lyricsTitle"></h2>
      <div id="lyricsBody" class="lyrics-body"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Musica e testi: Roberto Fader · Ambientato a Sinea, la città che ha ritrovato il sorriso.</p>
  </footer>

  <div class="player" id="player" hidden>
    <button class="pbtn" id="prev" type="button" aria-label="Precedente">⏮</button>
    <button class="pbtn big" id="toggle" type="button" aria-label="Riproduci">▶</button>
    <button class="pbtn" id="next" type="button" aria-label="Successiva">⏭</button>
    <div class="pinfo">
      <span id="nowTitle"></span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Posizione">
    </div>
    <span class="ptime" id="time">0:00</span>
  </div>
  <audio id="audio" preload="none"></audio>

  <script src="assets/js/canzoni.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
